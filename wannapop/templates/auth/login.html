{% extends "layout/_base.html" %}
{% block content %}
<div class="container">
  <h2>Inici de Sessió</h2>

  <!-- Formulari de login amb WTForms -->
  <form method="POST">
    {{ form.hidden_tag() }}

    <p>{{ form.email.label }} {{ form.email }}</p>
    <p>{{ form.password.label }} {{ form.password }}</p>

    <p>{{ form.submit }}</p>
  </form>

  <p>No tens compte? <a href="{{ url_for('auth.register') }}">Registra't aquí</a></p>
</div>
{% endblock %}
