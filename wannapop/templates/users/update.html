{% extends "layout/_base.html" %}
{% block content %}
<h1>Editar Usuari</h1>

<form method="POST" enctype="multipart/form-data">
    {{ form.hidden_tag() }}
    <p>{{ form.name.label }} {{ form.name }}</p>
    <p>{{ form.email.label }} {{ form.email }}</p>
    <p>{{ form.password.label }} {{ form.password }}</p>
    <p>{{ form.avatar.label }} {{ form.avatar }}</p>
    <p>{{ form.submit }}</p>
</form>
{% endblock %}
